name: 🐳🌍 Universal Docker Hub Push (Alpine)

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Das Gatter. Ohne einen gruenen Durchlauf hier wird kein Image veroeffentlicht.
  # Wer DDC aus Unraid Community Apps installiert, bekommt genau dieses Image -
  # laufen die Tests nicht, merkt das niemand, bis es auf dem Server des Nutzers
  # auffaellt. Siehe SPEC.md Z10.
  test:
    name: Testlauf (Gatter)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run the test suite group by group
        run: |
          # Eine Gruppe je Aufruf - die Begruendung steht in tests/GROUPS.txt.
          # Kein "|| true" und kein continue-on-error: dieser Schritt IST das
          # Gatter. Der Standard-Shell von GitHub laeuft mit -e, ein rotes pytest
          # beendet den Schritt also sofort.
          while read -r gruppe; do
            case "$gruppe" in ''|'#'*) continue ;; esac
            echo "::group::$gruppe"
            python -m pytest "$gruppe" -q
            echo "::endgroup::"
          done < tests/GROUPS.txt

  build_and_push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: dockerdiscordcontrol/dockerdiscordcontrol
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=unraid,enable={{is_default_branch}}

      - name: Build and push Universal (Alpine Optimized)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max 