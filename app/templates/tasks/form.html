<h4>{{ _t('web.tasks.form_title') }}</h4>
<p class="form-text mb-3">{{ _t('web.tasks.form_description') }}</p>

<!-- Task Add Form - Removed outer border/padding -->
<div id="taskFormContainer">
    <div class="row g-3">
        <div class="col-md-6">
            <label for="taskContainer" class="form-label">{{ _t('web.tasks.col_container') }}</label>
            <select class="form-select" id="taskContainer" name="container" required>
                <option selected disabled value="">{{ _t('web.tasks.select_container') }}</option>
                {% if active_containers %}
                    {% for container_name in active_containers %}
                        <option value="{{ container_name }}">{{ container_name }}</option>
                    {% endfor %}
                {% else %}
                    <option disabled>{{ _t('web.tasks.no_active_containers') }}</option>
                {% endif %}
                {# The operator's groups, filled from /api/groups below. A group
                   is chosen in the same list as a container, so there is no
                   second way of picking a target - only the label says which
                   kind it is, and data-group tells the form. #}
                <optgroup id="task-target-group" label="{{ _t('web.groups.title') }}" hidden></optgroup>
            </select>
            <div class="form-text">{{ _t('web.tasks.container_help') }}</div>
        </div>
        <div class="col-md-6">
            <label for="taskAction" class="form-label">{{ _t('web.tasks.col_action') }}</label>
            <select class="form-select" id="taskAction" name="action" required>
                <option selected disabled value="">{{ _t('web.tasks.please_select') }}</option>
                <option value="start">{{ _t('web.tasks.action_start') }}</option>
                <option value="stop">{{ _t('web.tasks.action_stop') }}</option>
                <option value="restart">{{ _t('web.tasks.action_restart') }}</option>
                <!-- Add more actions here -->
            </select>
            <div class="form-text">{{ _t('web.tasks.action_help') }}</div>
        </div>
        <div class="col-md-4">
            <label for="taskCycle" class="form-label">{{ _t('web.tasks.col_cycle') }}</label>
            <select class="form-select" id="taskCycle" name="cycle" required>
                <option selected disabled value="">{{ _t('web.tasks.please_select') }}</option>
                <option value="once">{{ _t('web.tasks.cycle_once') }}</option>
                <option value="daily">{{ _t('web.tasks.cycle_daily') }}</option>
                <option value="weekly">{{ _t('web.tasks.cycle_weekly') }}</option>
                <option value="monthly">{{ _t('web.tasks.cycle_monthly') }}</option>
                <option value="yearly">{{ _t('web.tasks.cycle_yearly') }}</option>
                <option value="cron">{{ _t('web.tasks.cycle_cron') }}</option>
            </select>
            <div class="form-text">{{ _t('web.tasks.cycle_help') }}</div>
        </div>
        <div class="col-md-4">
            <label for="taskTime" class="form-label">{{ _t('web.tasks.time_label') }} <span class="text-info">{{ timezone_name }}</span></label>
            <input type="time" class="form-control" id="taskTime" name="time" required>
            <div class="form-text">{{ _t('web.tasks.time_help') }} {{ timezone_str }}</div>
        </div>
        
        <!-- Date fields in one row -->
        <div class="col-md-4" id="dateFieldsContainer">
            <label class="form-label">{{ _t('web.tasks.date_label') }}</label>
            <div class="row g-2">
                <div class="col-4" id="dayFieldContainer">
                    <input type="text" class="form-control" id="taskDay" name="day" placeholder="{{ _t('web.tasks.day_placeholder') }}">
                    <select class="form-control" id="taskWeekday" name="weekday" style="display: none;">
                        <option value="Mon">{{ _t('web.tasks.monday') }}</option>
                        <option value="Tue">{{ _t('web.tasks.tuesday') }}</option>
                        <option value="Wed">{{ _t('web.tasks.wednesday') }}</option>
                        <option value="Thu">{{ _t('web.tasks.thursday') }}</option>
                        <option value="Fri">{{ _t('web.tasks.friday') }}</option>
                        <option value="Sat">{{ _t('web.tasks.saturday') }}</option>
                        <option value="Sun">{{ _t('web.tasks.sunday') }}</option>
                    </select>
                </div>
                <div class="col-4">
                    <input type="text" class="form-control" id="taskMonth" name="month" placeholder="{{ _t('web.tasks.month_placeholder') }}">
                </div>
                <div class="col-4">
                    <input type="number" class="form-control" id="taskYear" name="year" placeholder="{{ _t('web.tasks.year_placeholder') }}" min="2025">
                </div>
            </div>
            <div class="form-text">{{ _t('web.tasks.date_help') }}</div>
        </div>
        
        <div class="col-md-12" id="taskCronStringRow" style="display: none;">
            <label for="taskCronString" class="form-label">{{ _t('web.tasks.cron_string_label') }}</label>
            <input type="text" class="form-control" id="taskCronString" name="cron_string">
            <div class="form-text">{{ _t('web.tasks.cron_string_help') }}</div>
        </div>
        
        <!-- Hidden field for server-side timezone -->
        <input type="hidden" id="serverTimezone" name="timezone_str" value="{{ timezone_str }}">
    </div>
    <div class="mt-3">
        <button type="button" class="btn btn-primary" id="createTaskButton">{{ _t('web.tasks.create_btn') }}</button>
        <button type="button" class="btn btn-secondary" id="cancelTaskButton">{{ _t('web.common.cancel') }}</button>
    </div>
    <div id="responseMessage" class="mt-3"></div>
</div>

<script>
    // Translated by the server; app/static/js/task_form.js reads them from here.
    window.DDC_TASK_FORM = {
        errSelectContainer: {{ _t('web.tasks.err_select_container') | tojson }},
        errSelectAction: {{ _t('web.tasks.err_select_action') | tojson }},
        errSelectCycle: {{ _t('web.tasks.err_select_cycle') | tojson }},
        errEnterTime: {{ _t('web.tasks.err_enter_time') | tojson }},
        errOnceDate: {{ _t('web.tasks.err_once_date_required') | tojson }},
        errOnceFuture: {{ _t('web.tasks.err_once_future_date') | tojson }},
        errMonthlyDay: {{ _t('web.tasks.err_monthly_day') | tojson }},
        errEnterCron: {{ _t('web.tasks.err_enter_cron') | tojson }},
        addTaskUrl: {{ url_for("tasks_bp.add_task") | tojson }},
        taskAdded: {{ _t("web.tasks.task_added_success") | tojson }},
        errorLabel: {{ _t("web.common.error") | tojson }},
        unknownError: {{ _t("web.common.unknown_error") | tojson }},
        errSending: {{ _t("web.tasks.err_sending_request") | tojson }},
    };
</script>
<script src="{{ url_for('static', filename='js/task_form.js') }}"></script>
