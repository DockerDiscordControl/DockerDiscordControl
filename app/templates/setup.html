<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ _t('web.setup.page_title') }}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/bootstrap-icons/font/bootstrap-icons.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/setup.css') }}">
</head>
<body>
    <div class="setup-container">
        <div class="setup-card">
            <div class="setup-logo">
                <i class="bi bi-gear-fill" style="font-size: 4rem; color: #36cfff;"></i>
            </div>
            
            <h1 class="setup-title">🚀 {{ _t('web.setup.welcome_title') }}</h1>
            <p class="setup-subtitle">{{ _t('web.setup.welcome_subtitle') }}</p>
            
            <div id="alerts"></div>
            
            <form id="setupForm">
                {# setup.html does not extend _base.html; FormData(this) sends this field along #}
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="password">
                        <i class="bi bi-lock-fill"></i> {{ _t('web.setup.password_label') }}
                    </label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="{{ _t('web.setup.password_placeholder') }}" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">
                        <i class="bi bi-lock-fill"></i> {{ _t('web.setup.confirm_password_label') }}
                    </label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                           placeholder="{{ _t('web.setup.confirm_password_placeholder') }}" required>
                </div>

                <div class="password-requirements">
                    <i class="bi bi-info-circle"></i> {{ _t('web.setup.password_requirements') }}
                </div>

                <div class="form-group mt-4">
                    <button type="submit" class="btn btn-setup" id="setupBtn">
                        <span class="btn-text">{{ _t('web.setup.complete_setup_btn') }}</span>
                        <span class="btn-loading d-none">
                            <span class="spinner-border" role="status" aria-hidden="true"></span>
                            {{ _t('web.setup.setting_up') }}
                        </span>
                    </button>
                </div>
            </form>
            
            <div class="mt-4 text-center">
                <small style="color: rgba(255, 255, 255, 0.6);">
                    <i class="bi bi-shield-check"></i>
                    {{ _t('web.setup.security_note') }}
                </small>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
    <script>
        document.getElementById('setupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('setupBtn');
            const btnText = btn.querySelector('.btn-text');
            const btnLoading = btn.querySelector('.btn-loading');
            const alerts = document.getElementById('alerts');
            
            // Clear previous alerts
            alerts.innerHTML = '';
            
            // Get form data
            const formData = new FormData(this);
            const password = formData.get('password');
            const confirmPassword = formData.get('confirm_password');
            
            // Client-side validation
            if (!password || !confirmPassword) {
                showAlert({{ _t("web.setup.err_fill_both")|tojson }}, 'danger');
                return;
            }

            if (password !== confirmPassword) {
                showAlert({{ _t("web.setup.err_passwords_mismatch")|tojson }}, 'danger');
                return;
            }

            // Same rule as the server (main_routes.setup_save): 12+ characters and at least
            // three of lowercase, uppercase, digit, symbol.
            if (password.length < 12) {
                showAlert({{ _t("web.setup.err_password_too_short")|tojson }}, 'danger');
                return;
            }

            const characterClasses = [/[a-z]/, /[A-Z]/, /\d/, /[^A-Za-z0-9]/]
                .filter(pattern => pattern.test(password)).length;
            if (characterClasses < 3) {
                showAlert({{ _t("web.setup.password_requirements")|tojson }}, 'danger');
                return;
            }
            
            // Show loading state
            btn.disabled = true;
            btnText.classList.add('d-none');
            btnLoading.classList.remove('d-none');
            
            try {
                const response = await fetch('/setup', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert(result.message + ' ' + {{ _t("web.setup.redirecting")|tojson }}, 'success');

                    // Auto-login: pre-authenticate with the new credentials
                    // so the browser caches Basic Auth and skips the login prompt
                    setTimeout(() => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('GET', '/', true, 'admin', password);
                        xhr.onload = function() {
                            window.location.href = '/';
                        };
                        xhr.onerror = function() {
                            window.location.href = '/';
                        };
                        xhr.send();
                    }, 1500);
                } else {
                    showAlert(result.error || {{ _t("web.setup.err_setup_failed")|tojson }}, 'danger');
                }
            } catch (error) {
                showAlert({{ _t("web.setup.err_setup_failed")|tojson }} + ': ' + error.message, 'danger');
            } finally {
                // Reset button state
                btn.disabled = false;
                btnText.classList.remove('d-none');
                btnLoading.classList.add('d-none');
            }
        });
        
        function showAlert(message, type) {
            const alerts = document.getElementById('alerts');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            // Text, not markup: the message can come from the server or the
            // browser (CodeQL #57).
            alert.textContent = message;
            const close = document.createElement('button');
            close.type = 'button';
            close.className = 'btn-close';
            close.setAttribute('data-bs-dismiss', 'alert');
            close.style.filter = 'invert(1)';
            alert.appendChild(close);
            alerts.appendChild(alert);
            
            // Auto-dismiss success alerts
            if (type === 'success') {
                setTimeout(() => {
                    alert.remove();
                }, 5000);
            }
        }
        
        // Real-time password match validation
        document.getElementById('confirm_password').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            
            if (confirmPassword && password !== confirmPassword) {
                this.style.borderColor = '#dc3545';
            } else {
                this.style.borderColor = '';
            }
        });
    </script>
</body>
</html>
