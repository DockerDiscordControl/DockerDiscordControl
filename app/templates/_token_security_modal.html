<!-- Token Security Modal -->
<div class="modal fade" id="tokenSecurityModal" tabindex="-1" aria-labelledby="tokenSecurityModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tokenSecurityModalLabel">
                    <i class="bi bi-shield-lock"></i> {{ _t('web.token_security.title') }}
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Security Status Content -->
                <div id="tokenSecurityContent">
                    <div class="text-center">
                        <div class="spinner-border spinner-border-sm" role="status">
                            <span class="visually-hidden">{{ _t('web.common.loading') }}</span>
                        </div>
                        <span class="ms-2">{{ _t('web.token_security.checking_status') }}</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{{ _t('web.common.close') }}</button>
                <button type="button" class="btn btn-primary" onclick="refreshTokenStatusModal()">
                    <i class="bi bi-arrow-clockwise"></i> {{ _t('web.token_security.refresh_status') }}
                </button>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/token_security_modal.js') }}"></script>
