<hr class="my-4">
<div id="language-settings" class="mb-3 card p-3">
    <h4 class="mt-2"><i class="bi bi-globe2"></i> {{ _t('web.lang.title') }}</h4>
    <div class="row">
        <div class="col-md-4 mb-3 d-flex flex-column">
            <label for="ui_language" class="form-label">{{ _t('web.lang.ui_language_label') }}</label>
            <div class="form-text">{{ _t('web.lang.ui_language_help') }} <strong>{{ _t('web.lang.immediate_effect') }}</strong></div>
            <select class="form-select mt-auto" id="ui_language" name="ui_language" data-immediate-effect="true" onchange="switchUiLanguage(this.value)">
                {% for lang in available_languages %}
                    <option value="{{ lang.code }}" {% if ui_language == lang.code %}selected{% endif %}>{{ lang.native }} ({{ lang.name }})</option>
                {% endfor %}
            </select>

        </div>
        <div class="col-md-4 mb-3 d-flex flex-column">
            <label for="language" class="form-label">{{ _t('web.lang.bot_language_label') }}</label>
            <div class="form-text">{{ _t('web.lang.bot_language_help') }} <strong>{{ _t('web.lang.immediate_effect') }}</strong></div>
            <select class="form-select mt-auto" id="language" name="language" data-immediate-effect="true">
                {% for lang in available_languages %}
                    <option value="{{ lang.code }}" {% if config.language == lang.code %}selected{% endif %}>{{ lang.native }} ({{ lang.name }})</option>
                {% endfor %}
            </select>

        </div>
        <div class="col-md-4 mb-3 d-flex flex-column">
            <label for="timezone" class="form-label">{{ _t('web.lang.timezone_label') }}</label>
            <div class="form-text">{{ _t('web.lang.timezone_help') }} <strong>{{ _t('web.lang.immediate_effect') }}</strong></div>
            <select class="form-select mt-auto" id="timezone" name="timezone" data-immediate-effect="true">
                {% for tz in common_timezones %}
                    <option value="{{ tz }}" {% if config.timezone == tz %}selected{% endif %}>{{ tz }}</option>
                {% endfor %}
            </select>

        </div>
    </div>

</div>
<script>
function switchUiLanguage(lang) {
    const formData = new FormData();
    formData.set('ui_language', lang);
    fetch("{{ url_for('main_bp.set_ui_language') }}", {
        method: 'POST',
        body: formData,
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            window.location.reload();
        }
    })
    .catch(err => console.error('Language switch failed:', err));
}
</script>
